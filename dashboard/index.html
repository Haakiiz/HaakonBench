<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HåkonBench</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'><path d='M12 2h16l10 10v16L28 38H12L2 28V12z' fill='%23b3161c' stroke='%23000' stroke-width='2'/><circle cx='20' cy='20' r='11' fill='%231a0506' stroke='%23f3eadb' stroke-width='2.4'/><path d='M14.3 20c2.4-3.6 6.6-4.2 9.6-.6l1.8-1.8v4.8l-1.8-1.8c-3 3.6-7.2 3-9.6-.6z' fill='%23ffc21a'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Chakra+Petch:wght@500;600;700&family=Barlow:wght@400;500;600;700&family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/" aria-label="HåkonBench — alle runs">
      <svg class="emblem" viewBox="0 0 40 40" aria-hidden="true">
        <defs>
          <linearGradient id="hb-em-red" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e3262d"/><stop offset=".55" stop-color="#a0121a"/><stop offset="1" stop-color="#5c070b"/></linearGradient>
        </defs>
        <path d="M12 2h16l10 10v16L28 38H12L2 28V12z" fill="url(#hb-em-red)" stroke="#050505" stroke-width="2" stroke-linejoin="round"/>
        <path d="M12.8 4h14.4l8.8 8.8v14.4L27.2 36H12.8L4 27.2V12.8z" fill="none" stroke="rgba(255,255,255,.28)" stroke-width="1"/>
        <circle cx="20" cy="20" r="11" fill="#1a0506" stroke="#f3eadb" stroke-width="2.2"/>
        <path d="M20 5.5v5M20 29.5v5M5.5 20h5M29.5 20h5" stroke="#f3eadb" stroke-width="2.2" stroke-linecap="square"/>
        <path d="M14.3 20c2.4-3.6 6.6-4.2 9.6-.6l1.8-1.8v4.8l-1.8-1.8c-3 3.6-7.2 3-9.6-.6z" fill="#ffc21a"/>
        <circle cx="16.8" cy="19.4" r=".9" fill="#1a0506"/>
      </svg>
      <span class="brand-full">HåkonBench</span><span class="brand-short" aria-hidden="true">HB</span>
    </a>
    <nav class="nav">
      <a href="#/" data-nav="runs">Runs</a>
      <a href="#/new" data-nav="new">Ny run</a>
      <a href="#/live" data-nav="live" id="nav-live">Live <span class="live-dot" id="live-dot" hidden></span><span class="live-count" id="live-count"></span></a>
    </nav>
    <div class="topbar-right">
      <span class="badge demo" id="demo-badge" hidden title="Ingen API-kall — alt skjer på en kopi av results/">DEMO</span>
      <span class="chip mono" id="prompt-chip" title="Hash av nåværende PROMPT i haakonbench.py"></span>
      <button class="icon-btn mute" id="mute-btn" type="button" aria-pressed="false" aria-label="Lyd av" title="Slå av lyd" data-sfx="none">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path class="spk" d="M3 9h4l5-4.5v15L7 15H3z"/>
          <g class="waves"><path d="M15.5 9.2a4 4 0 0 1 0 5.6"/><path d="M18.3 6.6a7.6 7.6 0 0 1 0 10.8"/></g>
          <g class="cross"><path d="M15.5 9.5l5 5M20.5 9.5l-5 5"/></g>
        </svg>
      </button>
    </div>
  </header>

  <main id="view" class="view"></main>

  <aside class="drawer" id="drawer" aria-hidden="true" inert>
    <div class="drawer-backdrop" data-close-drawer></div>
    <div class="drawer-panel" role="dialog" aria-modal="true" aria-labelledby="drawer-title">
      <header class="drawer-head">
        <div id="drawer-title"></div>
        <button class="icon-btn" data-close-drawer aria-label="Lukk">✕</button>
      </header>
      <div class="drawer-body" id="drawer-body" tabindex="0"></div>
    </div>
  </aside>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <!-- Decorative only: the scan beam that repaints the screen on route changes, and the boot screen
       shown once per tab session while /api/config loads. Both aria-hidden, never focusable. -->
  <div class="swap-veil" id="swap-veil" aria-hidden="true"></div>
  <div class="boot" id="boot" aria-hidden="true">
    <div class="boot-screen">
      <div class="boot-title">HÅKONBENCH · KOMMANDOKONSOLL</div>
      <div class="boot-line" style="--d:0">&gt; INITIALISERER SYSTEM <span class="boot-dots"></span> <b>OK</b></div>
      <div class="boot-line" style="--d:1">&gt; KOBLER TIL SERVER <span class="boot-dots"></span> <b>OK</b></div>
      <div class="boot-line" style="--d:2">&gt; HENTER KONFIGURASJON <span class="boot-dots"></span> <span class="boot-cursor"></span></div>
      <div class="boot-bar"><i></i></div>
    </div>
  </div>
  <script>
    // Boot screen: once per tab session, never under reduced motion. Runs before first paint of the overlay.
    (function () {
      var b = document.getElementById("boot"), skip = false;
      try { skip = sessionStorage.getItem("hb.booted") === "1"; sessionStorage.setItem("hb.booted", "1"); } catch (e) { /* storage blocked */ }
      if (skip || (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches)) b.remove();
    })();
  </script>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <script src="/static/sound.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
