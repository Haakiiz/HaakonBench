<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HåkonBench</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23e8b44c'/><path d='M7 17c4-6 11-7 16-1l3-3v8l-3-3c-5 6-12 5-16-1z' fill='%230d1017'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="var(--accent)"/><path d="M7 17c4-6 11-7 16-1l3-3v8l-3-3c-5 6-12 5-16-1z" fill="var(--bg)"/></svg>
      <span>HåkonBench</span>
    </a>
    <nav class="nav">
      <a href="#/" data-nav="runs">Runs</a>
      <a href="#/new" data-nav="new">Ny run</a>
      <a href="#/live" data-nav="live" id="nav-live">Live <span class="live-dot" id="live-dot" hidden></span><span class="live-count" id="live-count"></span></a>
    </nav>
    <div class="topbar-right">
      <span class="badge demo" id="demo-badge" hidden title="Ingen API-kall — alt skjer på en kopi av results/">DEMO</span>
      <span class="chip mono" id="prompt-chip" title="Hash av nåværende PROMPT i haakonbench.py"></span>
    </div>
  </header>

  <main id="view" class="view"></main>

  <aside class="drawer" id="drawer" aria-hidden="true">
    <div class="drawer-backdrop" data-close-drawer></div>
    <div class="drawer-panel" role="dialog" aria-modal="true">
      <header class="drawer-head">
        <div id="drawer-title"></div>
        <button class="icon-btn" data-close-drawer aria-label="Lukk">✕</button>
      </header>
      <div class="drawer-body" id="drawer-body"></div>
    </div>
  </aside>

  <div class="toast" id="toast" hidden></div>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
